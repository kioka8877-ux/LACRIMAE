name: DEV8 — Spider-Man F03+F04 Render

on:
  workflow_dispatch:
    inputs:
      skip_download:
        description: 'Skip artifact download (use repo assets)'
        required: false
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: F03_PREVIEW/CODEBASE/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg



      - name: Verify repo assets
        run: |
          echo "=== public/ ==="
          ls -la F03_PREVIEW/CODEBASE/public/
          echo "=== clips ==="
          ls -la F03_PREVIEW/CODEBASE/public/clips/
          echo "=== audio ==="
          ls -la F03_PREVIEW/CODEBASE/public/audio/

      - name: Install & Build F03
        working-directory: F03_PREVIEW/CODEBASE
        run: |
          npm ci
          npx vite build

      - name: Render MP4 (F04)
        working-directory: F03_PREVIEW/CODEBASE
        run: npx remotion render src/remotion/index.js LacrimaeShort out/short_final.mp4 --timeout=120000

      - name: Verify output
        run: |
          test -f F03_PREVIEW/CODEBASE/out/short_final.mp4
          ls -lh F03_PREVIEW/CODEBASE/out/short_final.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: dev8-spiderman-short-${{ github.run_id }}
          path: F03_PREVIEW/CODEBASE/out/short_final.mp4
          if-no-files-found: error
          retention-days: 14
