name: DEV8 — Spider-Man F03+F04 Render

on:
  workflow_dispatch:
    inputs:
      f00e_run_id:
        description: 'Run F00-E (Spider-Man clips)'
        required: true
        type: string
      music_run_id:
        description: 'Run F00-MUSIC (Spider-Man audio)'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: F03_PREVIEW/CODEBASE/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download F00-E artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.f00e_run_id }}" --repo "${{ github.repository }}" --name "dev8-spiderman-f00e-${{ inputs.f00e_run_id }}" --dir /tmp/dev8-f00e
          echo "=== F00-E ==="
          ls -la /tmp/dev8-f00e/
          ls -la /tmp/dev8-f00e/clips/ 2>/dev/null

      - name: Download F00-MUSIC artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.music_run_id }}" --repo "${{ github.repository }}" --name "dev8-spiderman-music-${{ inputs.music_run_id }}" --dir /tmp/dev8-music
          echo "=== F00-MUSIC ==="
          ls -la /tmp/dev8-music/
          cat /tmp/dev8-music/music_timeline.json

      - name: Inject assets into F03 Preview
        run: |
          mkdir -p F03_PREVIEW/CODEBASE/public/clips
          cp /tmp/dev8-f00e/reveal_sources.json F03_PREVIEW/CODEBASE/public/reveal_sources.json
          cp /tmp/dev8-f00e/clips/*.mp4 F03_PREVIEW/CODEBASE/public/clips/
          cp /tmp/dev8-music/music_timeline.json F03_PREVIEW/CODEBASE/public/music_timeline.json
          cp /tmp/dev8-music/music.mp3 F03_PREVIEW/CODEBASE/public/music.mp3
          echo "=== Injected assets ==="
          ls -la F03_PREVIEW/CODEBASE/public/

      - name: Install & Build F03
        working-directory: F03_PREVIEW/CODEBASE
        run: |
          npm ci
          npm run build

      - name: Render MP4 (F04)
        working-directory: F03_PREVIEW/CODEBASE
        run: npm run render

      - name: Verify output
        run: |
          test -f F03_PREVIEW/CODEBASE/out/short_final.mp4
          ls -lh F03_PREVIEW/CODEBASE/out/short_final.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: dev8-spiderman-short-${{ github.run_id }}
          path: F03_PREVIEW/CODEBASE/out/short_final.mp4
          if-no-files-found: error
          retention-days: 14
