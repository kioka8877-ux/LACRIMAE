name: DEV9 — Spider-Man Ranking Render

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durée max du rendu en secondes'
        required: false
        default: '15'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    name: F04 Render Ranking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: F03_PREVIEW/CODEBASE/package-lock.json

      - name: Install dependencies
        working-directory: F03_PREVIEW/CODEBASE
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify codex exists
        run: |
          test -f F03_PREVIEW/CODEBASE/public/codex.json
          test -f F03_PREVIEW/CODEBASE/public/ranking_manifest.json
          echo "✅ Codex + ranking manifest present"

      - name: Verify clips exist
        run: |
          ls -la F03_PREVIEW/CODEBASE/public/clips/
          test -f F03_PREVIEW/CODEBASE/public/clips/reveal_01.mp4
          test -f F03_PREVIEW/CODEBASE/public/clips/reveal_02.mp4
          test -f F03_PREVIEW/CODEBASE/public/clips/reveal_03.mp4
          test -f F03_PREVIEW/CODEBASE/public/clips/reveal_04.mp4
          echo "✅ All 4 clips present"

      - name: Verify SFX exist
        run: |
          ls -la F03_PREVIEW/CODEBASE/public/sfx/
          test -f F03_PREVIEW/CODEBASE/public/sfx/impact.mp3
          test -f F03_PREVIEW/CODEBASE/public/sfx/king_reveal.mp3
          echo "✅ SFX files present"

      - name: Render ranking video
        working-directory: F03_PREVIEW/CODEBASE
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.js LacrimaeShort out/short_final.mp4 \
            --codec h264 \
            --image-format jpeg \
            --concurrency 2

      - name: Verify output
        run: |
          test -s F03_PREVIEW/CODEBASE/out/short_final.mp4
          ls -lh F03_PREVIEW/CODEBASE/out/short_final.mp4
          echo "✅ Render complete"

      - uses: actions/upload-artifact@v4
        with:
          name: dev9-ranking-final
          path: F03_PREVIEW/CODEBASE/out/short_final.mp4
          retention-days: 14
