name: F04 Hybrid Render

on:
  workflow_dispatch:
    inputs:
      codex_path:
        description: 'Codex Hybrid versionné à rendre'
        required: false
        default: 'F03_PREVIEW/IN/codex.json'
        type: string
      output_name:
        description: 'Nom du fichier MP4 final'
        required: false
        default: 'lacrimae_hybrid_f04.mp4'
        type: string
      f00b_run_id:
        description: 'Run F00-B validé contenant les séquences Match Cut matérialisées'
        required: true
        type: string
      intro_path:
        description: 'Chemin de la vidéo ou image Intro dans le workspace'
        required: true
        type: string
      intro_type:
        description: 'Type de l’asset Intro'
        required: false
        default: 'video'
        type: choice
        options:
          - video
          - image
          - auto
      intro_in:
        description: 'Début de l’extrait Intro en secondes'
        required: false
        default: '14'
        type: string
      intro_out:
        description: 'Fin de l’extrait Intro en secondes'
        required: false
        default: '21'
        type: string
      music_run_id:
        description: 'Run F00-MUSIC optionnel contenant music_timeline.json et l’audio'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    name: F04 Hybrid — PICTOR render
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: F03_PICTOR/CODEBASE/package-lock.json

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installer PICTOR
        working-directory: F03_PICTOR/CODEBASE
        run: npm ci

      - name: Télécharger l’artifact F00-B Match Cut
        uses: actions/download-artifact@v4
        with:
          name: lacrimae-dev4-f00b-${{ inputs.f00b_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.f00b_run_id }}
          path: /tmp/f00b

      - name: Télécharger l’artifact F00-MUSIC optionnel
        if: ${{ inputs.music_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: lacrimae-dev7-f00-music-${{ inputs.music_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.music_run_id }}
          path: /tmp/music

      - name: Préparer le codex Hybrid et les assets F00-D

        env:
          CODEX_PATH: ${{ inputs.codex_path }}
          INTRO_PATH: ${{ inputs.intro_path }}
          INTRO_TYPE: ${{ inputs.intro_type }}
          INTRO_IN: ${{ inputs.intro_in }}
          INTRO_OUT: ${{ inputs.intro_out }}
        run: |
          test -f "$CODEX_PATH"
          test -f /tmp/f00b/sequences.json
          test -f "$INTRO_PATH"
          rm -rf F00_INGEST/OUT/f04_hybrid
          python3 F00_INGEST/CODEBASE/f00_hybrid.py \
            --matchcut-manifest /tmp/f00b/sequences.json \
            --intro "$INTRO_PATH" \
            --intro-type "$INTRO_TYPE" \
            --intro-in "$INTRO_IN" \
            --intro-out "$INTRO_OUT" \
            --out F00_INGEST/OUT/f04_hybrid
          cp "$CODEX_PATH" F03_PICTOR/CODEBASE/src/data/codex.json
          cp F00_INGEST/OUT/f04_hybrid/hybrid_manifest.json F03_PICTOR/CODEBASE/src/data/hybrid_manifest.json
          cp F00_INGEST/OUT/f04_hybrid/match_cut/sequences.json F03_PICTOR/CODEBASE/src/data/sequences.json
          mkdir -p F03_PICTOR/CODEBASE/public
          cp -R F00_INGEST/OUT/f04_hybrid/intro F03_PICTOR/CODEBASE/public/
          cp -R F00_INGEST/OUT/f04_hybrid/match_cut F03_PICTOR/CODEBASE/public/
          cp F00_INGEST/OUT/f04_hybrid/match_cut/sequences/seq_0001.mp4 F03_PICTOR/CODEBASE/public/video_source.mp4
          if [ -n '${{ inputs.music_run_id }}' ]; then
            test -f /tmp/music/music_timeline.json
            test -f /tmp/music/source_audio
            cp /tmp/music/music_timeline.json F03_PICTOR/CODEBASE/src/data/music_timeline.json
            mkdir -p F03_PICTOR/CODEBASE/public/audio
            cp /tmp/music/source_audio F03_PICTOR/CODEBASE/public/audio/source_audio
          fi
          if [ -f F03_PREVIEW/CODEBASE/public/logo.png ]; then cp F03_PREVIEW/CODEBASE/public/logo.png F03_PICTOR/CODEBASE/public/; fi
          if [ -d F03_PREVIEW/CODEBASE/public/backgrounds ]; then cp -R F03_PREVIEW/CODEBASE/public/backgrounds F03_PICTOR/CODEBASE/public/; fi

      - name: Vérifier la durée Hybrid
        working-directory: F03_PICTOR/CODEBASE
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          codex=json.loads(Path('src/data/codex.json').read_text())
          hybrid=json.loads(Path('src/data/hybrid_manifest.json').read_text())
          assert codex.get('session', {}).get('review_mode') == 'hybrid_narrative'
          assert hybrid.get('mode') == 'hybrid_narrative'
          sequence_data=json.loads(Path('src/data/sequences.json').read_text())
          sequence_count=len(sequence_data.get('sequences', []))
          assert sequence_data.get('materialized') is True
          assert sequence_count > 0
          assert all(row.get('file') for row in sequence_data['sequences'])
          print(f"Hybrid frames: {hybrid['total_frames']}; materialized sequences: {sequence_count}")
          print('Hybrid F04 inputs valid')
          PY

      - name: Rendre F04 Hybrid
        working-directory: F03_PICTOR/CODEBASE
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          mkdir -p ../OUT
          npx remotion render src/index.jsx LacrimaeShort "../OUT/$OUTPUT_NAME" --codec h264 --image-format jpeg --concurrency 1
          test -s "../OUT/$OUTPUT_NAME"
          sha256sum "../OUT/$OUTPUT_NAME" > "../OUT/$OUTPUT_NAME.sha256"

      - name: Publier le rendu F04
        uses: actions/upload-artifact@v4
        with:
          name: lacrimae-f04-hybrid-${{ github.run_id }}
          path: F03_PICTOR/OUT/
          if-no-files-found: error
          retention-days: 30
