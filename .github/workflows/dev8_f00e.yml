name: DEV8 F00-E — Reveal Clip Prep

on:
  workflow_dispatch:
    inputs:
      source_artifact_run_id:
        description: 'Run contenant un artifact dev8-reveal-sources-<run_id> avec sources/ et reveal_request.json'
        required: true
        type: string
      source_artifact_name:
        description: 'Nom de l’artifact source'
        required: false
        default: 'dev8-reveal-sources'
        type: string
      fps:
        description: 'FPS de sortie des clips'
        required: false
        default: '30'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les sources opérateur
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_artifact_run_id }}
          ARTIFACT: ${{ inputs.source_artifact_name }}
        run: |
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$ARTIFACT-$RUN_ID" --dir /tmp/dev8-sources
          test -f /tmp/dev8-sources/reveal_request.json
          test "$(find /tmp/dev8-sources/sources -type f | wc -l)" -ge 1
      - name: Installer les dépendances Python
        run: python3 -m pip install --user numpy
      - name: Exécuter F00-E
        run: |
          python3 F00_INGEST/CODEBASE/f00_reveal.py \
            --request /tmp/dev8-sources/reveal_request.json \
            --out "$RUNNER_TEMP/dev8-f00e" \
            --fps "${{ inputs.fps }}"
      - name: Valider l’artifact F00-E
        run: |
          test -f "$RUNNER_TEMP/dev8-f00e/reveal_sources.json"
          test "$(find "$RUNNER_TEMP/dev8-f00e/clips" -name '*.mp4' | wc -l)" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: dev8-f00e-${{ github.run_id }}
          path: ${{ runner.temp }}/dev8-f00e/
          if-no-files-found: error
          retention-days: 14
