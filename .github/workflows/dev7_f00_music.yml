name: DEV7 — F00-MUSIC Audio Timeline

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'URL publique du fichier audio à analyser'
        required: true
        type: string
      fps:
        description: 'FPS de la timeline vidéo'
        required: false
        default: '25'
        type: string
      threshold:
        description: 'Seuil RMS minimal pour les impacts'
        required: false
        default: '0.08'
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  analyze-audio:
    name: F00-MUSIC — analyze beats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev7
        uses: actions/checkout@v4
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Download audio asset
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          mkdir -p F00_INGEST/IN/audio F00_INGEST/OUT/music
          curl -fL --retry 3 --output F00_INGEST/IN/audio/source_audio "${AUDIO_URL}"
          test -s F00_INGEST/IN/audio/source_audio
      - name: Analyze beats and energy
        run: |
          python3 F00_INGEST/CODEBASE/f00_music.py \
            --audio F00_INGEST/IN/audio/source_audio \
            --output F00_INGEST/OUT/music/music_timeline.json \
            --fps '${{ inputs.fps }}' \
            --threshold '${{ inputs.threshold }}'
      - name: Validate audio contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('F00_INGEST/OUT/music/music_timeline.json')
          d = json.loads(p.read_text())
          assert d['schema_version'] == 'dev7.music-timeline.v1'
          assert d['enabled'] is True
          assert d['sample_rate'] == 48000
          assert isinstance(d['beats'], list)
          print('F00-MUSIC validated:', len(d['beats']), 'beats;', d['bpm'], 'BPM;', d['climax_time'], 'climax')
          PY
      - name: Publish music timeline
        uses: actions/upload-artifact@v4
        with:
          name: lacrimae-dev7-f00-music-${{ github.run_id }}
          path: |
            F00_INGEST/OUT/music/music_timeline.json
            F00_INGEST/IN/audio/source_audio
          if-no-files-found: error
