name: DEV9 — Spider-Man Ranking (F00-E + F00-F)

on:
  workflow_dispatch:

jobs:
  f00e-f00f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download Spider-Man clips
        run: |
          mkdir -p test_videos
          RELEASE="spiderman"
          TAGS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE")
          for row in $(echo "$TAGS" | jq -r '.assets[] | @base64'); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            NAME=$(_jq '.name')
            URL=$(_jq '.browser_download_url')
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$URL" -o "test_videos/$NAME"
          done
          ls -lh test_videos/

      - name: F00-E — Clip Prep
        run: |
          python3 F00_INGEST/CODEBASE/f00_reveal.py \
            --request <(cat <<'REQEOF'
          {
            "format": "reveal_compilation",
            "sources": [
              {"id": "reveal_01", "source": "test_videos/clip1.2.mp4", "in_seconds": 0, "out_seconds": 6, "mirror": false, "fit_mode": "crop"},
              {"id": "reveal_02", "source": "test_videos/clip2.2.mp4", "in_seconds": 5, "out_seconds": 9, "mirror": false, "fit_mode": "crop"},
              {"id": "reveal_03", "source": "test_videos/clip3.2.mp4", "in_seconds": 0, "out_seconds": 7, "mirror": false, "fit_mode": "crop"},
              {"id": "reveal_04", "source": "test_videos/clip4.2.mp4", "in_seconds": 51, "out_seconds": 54, "mirror": false, "fit_mode": "crop", "final_reveal": true}
            ]
          }
          REQEOF
          ) \
            --out /tmp/dev9-f00e

      - name: F00-F — Ranking Prep
        run: |
          python3 F00_INGEST/CODEBASE/f00_ranking.py \
            --clips-manifest /tmp/dev9-f00e/reveal_sources.json \
            --request F00_INGEST/IN/ranking_spiderman.json \
            --out /tmp/dev9-f00f

      - name: Show results
        run: |
          echo "=== F00-E clips ==="
          ls -lh /tmp/dev9-f00e/clips/
          echo ""
          echo "=== F00-F ranking manifest ==="
          cat /tmp/dev9-f00f/ranking_manifest.json

      - name: Upload F00-F artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev9-spiderman-ranking
          path: /tmp/dev9-f00f
          if-no-files-found: error

      - name: Upload F00-E artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev9-spiderman-clips
          path: /tmp/dev9-f00e
          if-no-files-found: error
