name: DEV8 — F04 Render Only (assets in repo)

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: F03_PREVIEW/CODEBASE/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Verify assets
        working-directory: F03_PREVIEW/CODEBASE
        run: |
          echo "=== public/ ==="
          ls -lh public/
          echo "=== public/clips/ ==="
          ls -lh public/clips/
          echo "=== public/audio/ ==="
          ls -lh public/audio/
          echo "=== Total size ==="
          du -sh public/

      - name: Install F03
        working-directory: F03_PREVIEW/CODEBASE
        run: npm ci

      - name: Render MP4 (F04)
        working-directory: F03_PREVIEW/CODEBASE
        run: npx remotion render src/remotion/index.js LacrimaeShort out/short_final.mp4

      - name: Verify output
        run: |
          test -f F03_PREVIEW/CODEBASE/out/short_final.mp4
          ls -lh F03_PREVIEW/CODEBASE/out/short_final.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: dev8-f04-render-${{ github.run_id }}
          path: F03_PREVIEW/CODEBASE/out/short_final.mp4
          if-no-files-found: error
          retention-days: 14
