# LACRIMAE — Preview F03 sur GitHub Pages
# Déploie la preview de montage (Porte III) sur https://kioka8877-ux.github.io/LACRIMAE/
#
# Sources de vérité (trackées dans le repo) :
#   F03_PREVIEW/IN/codex.json          — codex (session + clips) [commité à G3 / manuel]
#   F03_PREVIEW/IN/clips/clip_001.mp4  — le clip coupé 9:16 (le SEUL chargé par la preview)
#   SHARED/IN/backgrounds/*.png        — fonds PNG (faits une fois pour toutes)
#   SHARED/IN/logos/logo.png           — logo campagne (optionnel)
# public/ est régénéré à chaque build (le dossier est gitignoré).
#
# Déclencheurs :
#   - workflow_dispatch : déploiement manuel (ex. après validation du codex)
#   - workflow_run      : après chaque run de l'orchestrateur — si le run a produit
#                         l'artifact lac-clips (G3), le clip frais est pris en priorité
#   - push              : à chaque commit de codex / clip / fonds / logo / code preview
#
# ⚠️ Prérequis (une seule fois) : Settings → Pages → Source = "GitHub Actions"

name: LACRIMAE Preview Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["LACRIMAE Orchestrator"]
    types: [completed]
  push:
    branches: [dev, main]
    paths:
      - 'F03_PREVIEW/IN/**'
      - 'F03_PREVIEW/CODEBASE/src/**'
      - 'F03_PREVIEW/CODEBASE/index.html'
      - 'F03_PREVIEW/CODEBASE/package.json'
      - 'F03_PREVIEW/CODEBASE/vite.config.js'
      - 'SHARED/IN/**'
      - '.github/workflows/preview_pages.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer les clips du run orchestrateur (si run G3)
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lac-clips
          path: _pages_clips
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assembler public/ (codex + clip + fonds + logo)
        run: |
          set -e
          PUB="F03_PREVIEW/CODEBASE/public"
          mkdir -p "$PUB/backgrounds"

          # 1. Codex — source de vérité : F03_PREVIEW/IN/
          cp F03_PREVIEW/IN/codex.json "$PUB/codex.json"

          # 2. Clip 001 — priorité au clip frais du run orchestrateur, sinon au
          #    clip tracké dans IN/clips/, sinon au premier mp4 de l'artifact
          if [ -f "_pages_clips/clip_001.mp4" ]; then
            cp "_pages_clips/clip_001.mp4" "$PUB/clip_001.mp4"
          elif [ -f "F03_PREVIEW/IN/clips/clip_001.mp4" ]; then
            cp "F03_PREVIEW/IN/clips/clip_001.mp4" "$PUB/clip_001.mp4"
          elif compgen -G "_pages_clips/*.mp4" > /dev/null; then
            FIRST=$(ls _pages_clips/*.mp4 | head -n 1)
            cp "$FIRST" "$PUB/clip_001.mp4"
          else
            echo "Aucun clip trouve — la preview affichera le codex sans video"
          fi

          # 3. Fonds PNG + manifest (menu deroulant de la preview)
          if compgen -G "SHARED/IN/backgrounds/*.png" > /dev/null; then
            cp SHARED/IN/backgrounds/*.png "$PUB/backgrounds/"
          fi
          python3 - <<'PY'
          import json, pathlib
          files = sorted(p.name for p in pathlib.Path("SHARED/IN/backgrounds").glob("*.png"))
          pathlib.Path("F03_PREVIEW/CODEBASE/public/backgrounds/manifest.json").write_text(
              json.dumps({"files": files}), encoding="utf-8")
          PY

          # 4. Logo campagne (optionnel)
          if [ -f "SHARED/IN/logos/logo.png" ]; then
            cp "SHARED/IN/logos/logo.png" "$PUB/logo.png"
          fi

          echo "public/ assemble :"
          find "$PUB" -type f | sort

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + build (Vite)
        working-directory: F03_PREVIEW/CODEBASE
        run: |
          npm install
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: F03_PREVIEW/CODEBASE/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
