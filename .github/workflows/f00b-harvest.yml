name: F00B HARVEST (meme)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag de la GitHub Release contenant video_source.mp4 (vide = dernière release)'
        required: false
        default: ''
      cuts_file:
        description: 'Fichier de coupes (défaut: F00B/cuts.txt)'
        required: false
        default: 'F00B/cuts.txt'
      publish:
        description: 'Phase 2 — publier les memes validés vers SHARED/memes/ + commit/push dev3'
        type: boolean
        required: false
        default: false
  push:
    branches: [dev, dev2, dev3]
    paths:
      - 'F00B/cuts.txt'

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: F00B - Télécharger la vidéo source (Release GitHub)
        run: |
          REL_ARG=""
          if [ -n "${{ inputs.source_tag }}" ]; then REL_ARG="${{ inputs.source_tag }}"; fi
          python3 _tools/download_release_video.py F00B/IN/ $REL_ARG

      - name: F00B - Harvest (découpe + miniatures + validation ffprobe)
        run: |
          python3 F00B/CODEBASE/lac_f00b_harvest.py \
            --video F00B/IN/video_source.mp4 \
            --cuts ${{ inputs.cuts_file }}

      - name: F00B - Upload artifacts (clips + miniatures + manifest)
        uses: actions/upload-artifact@v4
        with:
          name: f00b-harvest
          path: F00B/OUT/
          retention-days: 14

      # ── Phase 2 : après vérification opérateur (download de l'artifact) ──
      - name: F00B - Publish (vers SHARED/memes/) + commit/push dev3
        if: inputs.publish
        run: |
          python3 F00B/CODEBASE/lac_f00b_harvest.py \
            --video F00B/IN/video_source.mp4 \
            --cuts ${{ inputs.cuts_file }} \
            --publish
          git config user.name "LACRIMAE F00B"
          git config user.email "f00b@users.noreply.github.com"
          git add SHARED/memes/
          if ! git diff --cached --quiet; then
            git commit -m "feat(meme): F00B — memes publiés depuis la récolte"
          else
            echo "  [!] Rien de nouveau à committer — memes identiques à la méméthèque."
          fi
          git push origin ${{ github.ref_name }}
