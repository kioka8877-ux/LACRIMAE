# LACRIMAE Orchestrator — Rubicon sur GitHub Actions
# DOCTRINE : l'Oracle (exécuteur) fait tourner les FRÉGATES, le Champion valide
# aux PORTES. Un run GHA = UNE FRÉGATE. Le Champion n'intervient qu'aux
# 4 portes : I Brief, II Cutlist, III Montage, IV Publication.
#
# Frégates (input fregate) :
#   F00  INGEST      — brief + yt-dlp → video_source.mp4 (Porte I)
#   F01  SELECT      — libre : vision OpenRouter → cutlist · forge : BRIDGE
#                      auto-récupère le pack PERTURABO/EXPORT → cutlist (Porte II)
#   F02  FORMAT      — blur-pad/reframe/background → codex.json + clips (Porte III)
#   F04  RENDER      — Remotion, 1 rendu par clip → clip_00X_finale.mp4
#   F05  CAMOUFLAGE  — métadonnées + loudnorm → clip_00X_youtube.mp4 (Porte IV)
#   F06  LUTHER      — stream copy → clip_00X_clean.mp4
#   CLOSE            — ferme la production (ledger)
#
# Secrets requis : ORACLE_API_KEY (secret), ORACLE_MODEL/ORACLE_BASE_URL (vars)

name: LACRIMAE Orchestrator

on:
  workflow_dispatch:
    inputs:
      fregate:
        description: 'Frégate à exécuter (F00|F01|F02|F04|F05|F06|CLOSE)'
        required: true
        default: 'F00'
      url:
        description: 'URL YouTube (F00 only)'
        required: false
      title:
        description: 'Titre de la production (F00 only)'
        required: false
      sujet:
        description: 'Sujet / brief oracle (F00 only)'
        required: false
      vibe:
        description: 'Vibe / tonalité (F00 only)'
        required: false
      sequences:
        description: 'Nombre de séquences 1-10 (F00 only)'
        required: false
        default: '2'
      min_dur:
        description: 'Durée min par séquence en secondes (F00 only)'
        required: false
        default: '3'
      max_dur:
        description: 'Durée max par séquence en secondes (F00 only)'
        required: false
        default: '10'
      profile:
        description: 'Profil F02 (blur-pad|reframe|background) (F00 only)'
        required: false
        default: 'blur-pad'
      pack_path:
        description: 'Pack local optionnel (forge only) — SI ABSENT, l''Oracle va chercher le pack SEUL dans PERTURABO/EXPORT'
        required: false
      pack_filter:
        description: 'Filtre du pack auto-récupéré (forge only, substring du nom, ex: SANDOVAL)'
        required: false
      release_tag:
        description: 'Tag de la Release contenant video_source.mp4 (optionnel — défaut: dernière release)'
        required: false
      preset:
        description: 'Preset couleurs codex (F00 only)'
        required: false
        default: 'punchy'
      model:
        description: 'Modèle vision OpenRouter (override)'
        required: false
      mode:
        description: 'Mode pipeline (libre|forge)'
        required: false
        default: 'libre'

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WORKFLOW_FILE: lacrimae_orchestrator.yml
  # Branche courante du run (dev | dev2 | dev3 ...) — les artifacts sont
  # récupérés depuis les runs de CETTE branche, pas d'une branche codée en dur.
  BRANCH: ${{ github.ref_name }}

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests yt-dlp -q

      # ─────────────────────── F00 : BRIEF + INGEST ────────────────────────

      - name: F00 - Ecrire le brief (Porte I)
        if: github.event.inputs.fregate == 'F00'
        env:
          URL: ${{ github.event.inputs.url }}
          TITLE: ${{ github.event.inputs.title }}
          SUJET: ${{ github.event.inputs.sujet }}
          VIBE: ${{ github.event.inputs.vibe }}
          SEQUENCES: ${{ github.event.inputs.sequences }}
          MIN_DUR: ${{ github.event.inputs.min_dur }}
          MAX_DUR: ${{ github.event.inputs.max_dur }}
          PROFILE: ${{ github.event.inputs.profile }}
          PRESET: ${{ github.event.inputs.preset }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          mkdir -p TRACKING
          jq -n \
            --arg url "$URL" \
            --arg title "$TITLE" \
            --arg sujet "$SUJET" \
            --arg vibe "$VIBE" \
            --arg seq "$SEQUENCES" \
            --arg min "$MIN_DUR" \
            --arg max "$MAX_DUR" \
            --arg profile "$PROFILE" \
            --arg preset "$PRESET" \
            --arg model "$MODEL" \
            '{source: $url, title: $title, sujet: $sujet, vibe: $vibe,
              sequences: ($seq|tonumber), min_dur: ($min|tonumber),
              max_dur: ($max|tonumber), profile: $profile, preset: $preset,
              model: $model}' > TRACKING/LACRIMAE_BRIEF.json
          cat TRACKING/LACRIMAE_BRIEF.json

      - name: F00 - Ingest
        if: github.event.inputs.fregate == 'F00'
        env:
          URL: ${{ github.event.inputs.url }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          cd F00_INGEST/CODEBASE
          if [ -n "$URL" ]; then
            python3 lac_f00_ingest.py --url "$URL" --output ../OUT/
          elif [ -f "../../SHARED/IN/video_source.mp4" ]; then
            python3 lac_f00_ingest.py --file "../../SHARED/IN/video_source.mp4" --output ../OUT/
          elif [ -f "../IN/video_source.mp4" ]; then
            python3 lac_f00_ingest.py --file "../IN/video_source.mp4" --output ../OUT/
          else
            # Vidéo > 100 Mo : uploadée par l'opérateur comme asset d'une GitHub
            # Release (_tools/lac_release_video.sh) — F00 la télécharge ici.
            REL_ARG=""
            if [ -n "$RELEASE_TAG" ]; then REL_ARG="$RELEASE_TAG"; fi
            echo "  [→] Aucune vidéo locale — recherche dans les GitHub Releases…"
            if python3 ../../_tools/download_release_video.py ../IN/ $REL_ARG; then
              python3 lac_f00_ingest.py --file "../IN/video_source.mp4" --output ../OUT/
            else
              echo "ERREUR: ni URL, ni SHARED/IN/video_source.mp4, ni vidéo en Release."
              echo "  → Upload : sh _tools/lac_release_video.sh <video.mp4> [tag]"
              exit 1
            fi
          fi

      - name: F00 - Gardien CUSTOS
        if: github.event.inputs.fregate == 'F00'
        run: python3 LAC_CUSTOS.py --frigate F00 --mode check-out --drive-base .

      # F00 - Upload vidéo : SEULEMENT si la vidéo est petite (< 400 Mo).
      # Les artifacts GHA sont limités (500 Mo de stockage total / repo en
      # plan gratuit, rétention 90 j). Une vidéo > 100 Mo vit dans la Release
      # GitHub (2 Go/asset, illimité, gratuit sur repo public) : les frégates
      # F01/F02 la re-téléchargent depuis la Release, PAS depuis l'artifact.
      - name: F00 - Check video size
        if: github.event.inputs.fregate == 'F00'
        id: vidsize
        run: |
          SIZE=$(stat -c%s F00_INGEST/OUT/video_source.mp4)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "  [→] Vidéo ingérée : $(( SIZE / 1000000 )) Mo"

      - name: F00 - Upload video (petit, < 400 Mo)
        if: github.event.inputs.fregate == 'F00' && fromJson(steps.vidsize.outputs.size) < 400000000
        uses: actions/upload-artifact@v4
        with:
          name: lac-video
          path: F00_INGEST/OUT/

      - name: F00 - Ledger + commit
        if: github.event.inputs.fregate == 'F00'
        run: |
          python3 _tools/update_ledger.py F00
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_BRIEF.json TRACKING/LACRIMAE_LEDGER.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "ledger: fregate F00 [skip ci]"
            git push
          fi
          echo "PORTE I: brief validé. Prochaine frégate: F01"

      # ─────────────────── F01 : SELECT (libre) ou FORGE (bridge) ───────────

      # F01 - Vidéo : d'abord la Release GitHub (2 Go/asset, illimité, gratuit
      # repo public — gère les vidéos > 100 Mo), sinon repli sur l'artifact
      # lac-video (vidéos petites / mode libre sans release).
      - name: F01 - Download video
        if: github.event.inputs.fregate == 'F01'
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p F01_SELECT/IN F02_FORMAT/IN
          REL_ARG=""
          if [ -n "$RELEASE_TAG" ]; then REL_ARG="$RELEASE_TAG"; fi
          echo "  [→] F01 : recherche de la vidéo dans les GitHub Releases…"
          VIDEO_OK=0
          if python3 _tools/download_release_video.py F02_FORMAT/IN/ $REL_ARG; then
            echo "  [✓] Vidéo depuis la Release"
            VIDEO_OK=1
          else
            echo "  [→] Pas de vidéo en Release — repli artifact lac-video…"
            if python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-video F02_FORMAT/IN/ "$BRANCH"; then
              echo "  [✓] Vidéo depuis l'artifact lac-video"
              VIDEO_OK=1
            fi
          fi
          # Mode libre : la vidéo est OBLIGATOIRE (F01 vision découpe la source).
          if [ "$VIDEO_OK" == "0" ] && [ "${{ github.event.inputs.mode }}" == "libre" ]; then
            echo "ERREUR: F01 (libre) exige une vidéo (Release GitHub ou artifact lac-video)."
            exit 1
          fi
          # Mode forge : pas de vidéo = OK si le pack est un meme (aucune découpe,
          # méméthèque SHARED/memes/). Le bridge tranche : pack stars → échec
          # bloquant (assets opérateur manquants) ; pack meme → staging memes.
          if [ "$VIDEO_OK" == "0" ]; then
            echo "  [!] Aucune vidéo locale — mode forge : le bridge décide (meme = sans vidéo)."
          fi
          if [ "${{ github.event.inputs.mode }}" == "libre" ] && [ -f F02_FORMAT/IN/video_source.mp4 ]; then
            cp F02_FORMAT/IN/video_source.mp4 F01_SELECT/IN/video_source.mp4
          fi

      # Mode FORGE : l'ORACLE va chercher le pack SEUL dans PERTURABO/EXPORT
      # (production_pack_*.json). Le bridge ne prend RIEN d'autre : la vidéo
      # vient de la Release/artifact, les fonds de SHARED/IN/backgrounds/ (faits
      # une fois pour toutes) et le logo de SHARED/IN/logos/logo.png.
      # F01 (vision) est SAUTÉE — les cuts viennent du pack Perturabo.
      - name: F01 - Forge bridge (Contrôle du pack)
        if: github.event.inputs.fregate == 'F01' && github.event.inputs.mode == 'forge'
        env:
          PACK: ${{ github.event.inputs.pack_path }}
          PACK_FILTER: ${{ github.event.inputs.pack_filter }}
        run: |
          PACK_ARG=""
          if [ -n "$PACK" ]; then PACK_ARG="--pack $PACK"; fi
          PACK_FILTER_ARG=""
          if [ -n "$PACK_FILTER" ]; then PACK_FILTER_ARG="--pack-filter $PACK_FILTER"; fi
          # Mode MEME : pas de video_source (memes pré-coupés dans la méméthèque)
          # → on ne passe --video que si une vidéo a été téléchargée.
          VIDEO_ARG=""
          if [ -f F02_FORMAT/IN/video_source.mp4 ]; then
            VIDEO_ARG="--video F02_FORMAT/IN/video_source.mp4"
          fi
          python3 BRIDGE_PERTURABO/CODEBASE/lac_bridge_forge.py \
            $PACK_ARG $PACK_FILTER_ARG $VIDEO_ARG
          # Mode MEME : pas de cutlist (F02 stage les memes directement) — la
          # copie est protégée pour ne pas planter sur un bridge meme.
          mkdir -p F02_FORMAT/IN
          if [ -f BRIDGE_PERTURABO/OUT/cutlist.json ]; then
            cp BRIDGE_PERTURABO/OUT/cutlist.json F02_FORMAT/IN/cutlist.json
          fi

      - name: F01 - Oracle (vision) — mode libre
        if: github.event.inputs.fregate == 'F01' && github.event.inputs.mode != 'forge'
        env:
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          ORACLE_MODEL: ${{ vars.ORACLE_MODEL }}
          ORACLE_BASE_URL: ${{ vars.ORACLE_BASE_URL }}
          SEQUENCES: ${{ github.event.inputs.sequences }}
          MIN_DUR: ${{ github.event.inputs.min_dur }}
          MAX_DUR: ${{ github.event.inputs.max_dur }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          cd F01_SELECT/CODEBASE
          BRIEF_TXT=$(python3 - <<'PYEOF'
          import json
          b = json.load(open('../../TRACKING/LACRIMAE_BRIEF.json'))
          print(' | '.join([v for v in (b.get('sujet',''), b.get('vibe',''), b.get('title','')) if v]))
          PYEOF
          )
          MODEL_ARG=""
          if [ -n "$MODEL" ]; then MODEL_ARG="--model $MODEL"; fi
          python3 lac_f01_select.py --oracle \
            --input ../IN/ --output ../OUT/ \
            --sequences "$SEQUENCES" --min-dur "$MIN_DUR" --max-dur "$MAX_DUR" \
            --brief "$BRIEF_TXT" $MODEL_ARG
          cp ../OUT/cutlist.json ../../F02_FORMAT/IN/cutlist.json

      - name: F01 - Gardien CUSTOS
        if: github.event.inputs.fregate == 'F01'
        run: |
          if [ "${{ github.event.inputs.mode }}" == "forge" ]; then
            python3 LAC_CUSTOS.py --frigate BRIDGE --mode check-out --drive-base .
          else
            python3 LAC_CUSTOS.py --frigate F01 --mode check-out --drive-base .
          fi

      - name: F01 - Commit cutlist (éditable par le Champion)
        if: github.event.inputs.fregate == 'F01'
        run: |
          python3 _tools/update_ledger.py F01
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          # En mode forge : le codex bridge (session + textes du pack) + le pack
          # auto-récupéré sont commités pour survivre jusqu'à F02 (run séparé —
          # le workspace ne persiste pas)
          if [ "${{ github.event.inputs.mode }}" == "forge" ]; then
            git add BRIDGE_PERTURABO/OUT/ BRIDGE_PERTURABO/IN/production_pack.json BRIDGE_PERTURABO/IN/production_pack_SA_VIDEO.json TRACKING/LACRIMAE_LEDGER.json
            # Mode MEME : pas de cutlist (F02 stage les memes) — add seulement
            # si le bridge en a produit une (le bridge meme n'en écrit pas).
            if [ -f F02_FORMAT/IN/cutlist.json ]; then
              git add F02_FORMAT/IN/cutlist.json
            fi
          else
            git add F02_FORMAT/IN/cutlist.json TRACKING/LACRIMAE_LEDGER.json
          fi
          git commit -m "ledger: fregate F01 — cutlist [skip ci]" || echo "No change"
          git push
          echo "PORTE II: vérifie/édite F02_FORMAT/IN/cutlist.json dans l'UI GitHub, puis frégate F02"

      - name: F01 - Upload cutlist
        # Mode MEME : pas de cutlist (memes pré-coupés) → l'upload est sauté
        if: github.event.inputs.fregate == 'F01' && hashFiles('F02_FORMAT/IN/cutlist.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lac-cutlist
          path: F02_FORMAT/IN/cutlist.json

      # ─────────────────────────── F02 : FORMAT ─────────────────────────────

      # F02 - Détection du mode : le bridge (run F01) commit bridge_report.json
      # avec sub_mode: "meme" pour un pack meme. F02 bascule sur le profil meme
      # (staging des memes, aucune découpe) et saute le téléchargement vidéo.
      - name: F02 - Detect mode (stars|meme)
        id: f02mode
        if: github.event.inputs.fregate == 'F02'
        run: |
          IS_MEME="false"
          if [ -f BRIDGE_PERTURABO/OUT/bridge_report.json ]; then
            if [ "$(python3 -c "import json; print(json.load(open('BRIDGE_PERTURABO/OUT/bridge_report.json')).get('sub_mode',''))")" == "meme" ]; then
              IS_MEME="true"
            fi
          fi
          echo "is_meme=$IS_MEME" >> "$GITHUB_OUTPUT"
          echo "  [→] F02 : mode $([ "$IS_MEME" == "true" ] && echo 'MEME (staging memes, pas de vidéo)' || echo 'stars (découpe vidéo)')"

      # F02 - Vidéo : même logique que F01 — Release GitHub d'abord, artifact en
      # repli. SAUTÉE en mode meme (aucune vidéo source : memes pré-coupés).
      - name: F02 - Download video
        if: github.event.inputs.fregate == 'F02' && steps.f02mode.outputs.is_meme != 'true'
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p F02_FORMAT/IN
          REL_ARG=""
          if [ -n "$RELEASE_TAG" ]; then REL_ARG="$RELEASE_TAG"; fi
          echo "  [→] F02 : recherche de la vidéo dans les GitHub Releases…"
          if python3 _tools/download_release_video.py F02_FORMAT/IN/ $REL_ARG; then
            echo "  [✓] Vidéo depuis la Release"
          else
            echo "  [→] Pas de vidéo en Release — repli artifact lac-video…"
            python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-video F02_FORMAT/IN/ "$BRANCH"
          fi

      # F02 - Mode MEME : staging des entrées F02 (codex bridge + méméthèque).
      # Le bridge a transité memes + codex vers F02/IN pendant le run F01, mais
      # ces copies ne sont PAS commitées (workspace éphémère) — on les re-stage
      # ici depuis les sources de vérité : SHARED/memes/ + BRIDGE_PERTURABO/OUT/
      # (le codex bridge, lui, est commité par F01).
      - name: F02 - Stage memes (mode meme)
        if: github.event.inputs.fregate == 'F02' && steps.f02mode.outputs.is_meme == 'true'
        run: |
          mkdir -p F02_FORMAT/IN/memes
          cp BRIDGE_PERTURABO/OUT/codex.json F02_FORMAT/IN/codex.json
          if compgen -G "SHARED/memes/*.mp4" > /dev/null; then
            cp SHARED/memes/*.mp4 F02_FORMAT/IN/memes/
          fi
          echo "  [→] F02 : memes stagés (IN/memes + IN/codex.json meme)"
          ls -la F02_FORMAT/IN/ F02_FORMAT/IN/memes/

      - name: F02 - Format (blur-pad/reframe/background/meme)
        if: github.event.inputs.fregate == 'F02'
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          cd F02_FORMAT/CODEBASE
          # Brief : profil/preset/titre (défauts robustes si brief absent)
          if [ -f ../../TRACKING/LACRIMAE_BRIEF.json ]; then
            PROFILE=$(python3 -c "import json; print(json.load(open('../../TRACKING/LACRIMAE_BRIEF.json')).get('profile','blur-pad'))")
            PRESET=$(python3 -c "import json; print(json.load(open('../../TRACKING/LACRIMAE_BRIEF.json')).get('preset','punchy'))")
            TITLE=$(python3 -c "import json; print(json.load(open('../../TRACKING/LACRIMAE_BRIEF.json')).get('title',''))")
          else
            PROFILE="blur-pad"; PRESET="punchy"; TITLE=""
          fi
          MODE_ARG=""
          FORGE_CODEX_ARG=""
          if [ "$MODE" == "forge" ] && [ -f "../../BRIDGE_PERTURABO/OUT/codex.json" ]; then
            MODE_ARG="--mode forge"
            # F02 lit le codex bridge : préserve la session (fond PNG/logo) et
            # reprend les textes par clip du pack — pas de quoting JSON en shell
            FORGE_CODEX_ARG="--forge-codex ../../BRIDGE_PERTURABO/OUT/codex.json"
          fi
          # Mode MEME : le bridge l'a détecté (sub_mode: meme) → F02 stage les
          # memes (profil meme, aucune découpe). Le codex meme est déjà dans
          # IN/codex.json (stage ci-dessus) — pas de --forge-codex (le profil
          # meme lit IN/codex.json directement).
          if [ -f "../../BRIDGE_PERTURABO/OUT/bridge_report.json" ]; then
            if [ "$(python3 -c "import json; print(json.load(open('../../BRIDGE_PERTURABO/OUT/bridge_report.json')).get('sub_mode',''))")" == "meme" ]; then
              PROFILE="meme"
              FORGE_CODEX_ARG=""
            fi
          fi
          python3 lac_f02_format.py --input ../IN/ --output ../OUT/ \
            --profile "$PROFILE" --preset "$PRESET" --title "$TITLE" $MODE_ARG $FORGE_CODEX_ARG

      - name: F02 - Gardien CUSTOS
        if: github.event.inputs.fregate == 'F02'
        run: python3 LAC_CUSTOS.py --frigate F02 --mode check-out --drive-base .

      - name: F02 - Commit codex + manifest + clips (éditable par le Champion)
        if: github.event.inputs.fregate == 'F02'
        run: |
          mkdir -p F03_PREVIEW/IN F03_PREVIEW/IN/clips F04_RENDER/IN
          cp F02_FORMAT/OUT/codex.json F03_PREVIEW/IN/codex.json
          cp F02_FORMAT/OUT/f02_manifest.json F03_PREVIEW/IN/f02_manifest.json
          cp F02_FORMAT/OUT/codex.json F04_RENDER/IN/codex.json
          cp F02_FORMAT/OUT/f02_manifest.json F04_RENDER/IN/f02_manifest.json
          # clip_001 → preview F03 (le clip tracké qui alimente GitHub Pages)
          if [ -f F02_FORMAT/OUT/clips/clip_001.mp4 ]; then
            cp F02_FORMAT/OUT/clips/clip_001.mp4 F03_PREVIEW/IN/clips/clip_001.mp4
          fi
          python3 _tools/update_ledger.py F02
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          # Les clips découpés (F02_FORMAT/OUT/clips/*.mp4) SONT commités —
          # tout est poussé sur GitHub et visible/validable par l'opérateur.
          git add F03_PREVIEW/IN/ F04_RENDER/IN/ F02_FORMAT/OUT/clips/ TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: fregate F02 — codex + clips [skip ci]" || echo "No change"
          git push
          echo "PORTE III: édite F03_PREVIEW/IN/codex.json (titre, volume, validated_by_magos: true), puis frégate F04"

      - name: F02 - Upload clips
        if: github.event.inputs.fregate == 'F02'
        uses: actions/upload-artifact@v4
        with:
          name: lac-clips
          path: F02_FORMAT/OUT/clips/

      # ─────────────────────────── F04 : RENDER ─────────────────────────────

      - name: F04 - Download clips
        if: github.event.inputs.fregate == 'F04'
        run: |
          mkdir -p F04_RENDER/CODEBASE/public F04_RENDER/IN/clips
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-clips F04_RENDER/CODEBASE/public/ "$BRANCH"
          cp F04_RENDER/CODEBASE/public/*.mp4 F04_RENDER/IN/clips/

      - name: F04 - Copy codex validé + logo + fond PNG
        if: github.event.inputs.fregate == 'F04'
        run: |
          cp F03_PREVIEW/IN/codex.json F04_RENDER/IN/codex.json
          cp F03_PREVIEW/IN/codex.json F04_RENDER/CODEBASE/public/codex.json
          if [ -f SHARED/IN/logos/logo.png ]; then
            cp SHARED/IN/logos/logo.png F04_RENDER/CODEBASE/public/logo.png
          fi
          # Mode forge : les PNG partagés (SHARED/IN/backgrounds/ + logos/, faits
          # une fois pour toutes par l'opérateur) sont re-transités vers public/
          # des F03+F04 (public/ est gitignoré) + manifest.json (menu déroulant)
          if [ "${{ github.event.inputs.mode }}" == "forge" ]; then
            mkdir -p F04_RENDER/CODEBASE/public/backgrounds F03_PREVIEW/CODEBASE/public/backgrounds
            if compgen -G "SHARED/IN/backgrounds/*.png" > /dev/null; then
              cp SHARED/IN/backgrounds/*.png F04_RENDER/CODEBASE/public/backgrounds/
              cp SHARED/IN/backgrounds/*.png F03_PREVIEW/CODEBASE/public/backgrounds/
              python3 -c "import json,pathlib; files=sorted(p.name for p in pathlib.Path('SHARED/IN/backgrounds').glob('*.png')); [ (pathlib.Path(d)/'manifest.json').write_text(json.dumps({'files':files}), encoding='utf-8') for d in ('F04_RENDER/CODEBASE/public/backgrounds','F03_PREVIEW/CODEBASE/public/backgrounds') ]"
            fi
            if [ -f SHARED/IN/logos/logo.png ]; then
              cp SHARED/IN/logos/logo.png F04_RENDER/CODEBASE/public/logo.png
              cp SHARED/IN/logos/logo.png F03_PREVIEW/CODEBASE/public/logo.png
            fi
            # Mode MEME : la méméthèque → public/memes/ (F03 preview + F04
            # rendu) + manifest.json (menu déroulant du parcours méméthèque)
            if compgen -G "SHARED/memes/*.mp4" > /dev/null; then
              mkdir -p F04_RENDER/CODEBASE/public/memes F03_PREVIEW/CODEBASE/public/memes
              cp SHARED/memes/*.mp4 F04_RENDER/CODEBASE/public/memes/
              cp SHARED/memes/*.mp4 F03_PREVIEW/CODEBASE/public/memes/
              python3 -c "import json,pathlib; files=sorted(p.name for p in pathlib.Path('SHARED/memes').glob('*.mp4')); [ (pathlib.Path(d)/'manifest.json').write_text(json.dumps({'files':files}), encoding='utf-8') for d in ('F04_RENDER/CODEBASE/public/memes','F03_PREVIEW/CODEBASE/public/memes') ]"
            fi
          fi

      - name: F04 - Gardien CUSTOS (check-in)
        if: github.event.inputs.fregate == 'F04'
        run: python3 LAC_CUSTOS.py --frigate F04 --mode check-in --drive-base .

      - name: F04 - Setup Node
        if: github.event.inputs.fregate == 'F04'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: F04 - Install dependencies
        if: github.event.inputs.fregate == 'F04'
        run: |
          cd F04_RENDER/CODEBASE
          npm install

      - name: F04 - Sync codexData.js depuis le codex validé
        if: github.event.inputs.fregate == 'F04'
        run: |
          cd F04_RENDER/CODEBASE
          python3 - <<'PYEOF'
          import json
          codex = json.load(open('public/codex.json', encoding='utf-8'))
          with open('src/codexData.js', 'w', encoding='utf-8') as f:
              f.write('export const codex = ' + json.dumps(codex, ensure_ascii=False, indent=2) + ';\n')
          print('codexData.js synchronisé depuis public/codex.json')
          PYEOF

      - name: F04 - Render Remotion (un rendu par clip)
        if: github.event.inputs.fregate == 'F04'
        run: |
          cd F04_RENDER/CODEBASE
          CLIP_IDS=$(python3 - <<'PYEOF'
          import json
          c = json.load(open('public/codex.json', encoding='utf-8'))
          clips = c.get('clips') or [c]
          for clip in clips:
              raw = clip.get('id') or clip['video']['source'].replace('.mp4','')
              comp = raw.replace('_', '-')
              print(f"{raw} {comp}")
          PYEOF
          )
          mkdir -p ../OUT
          echo "$CLIP_IDS" | while read -r RAW CID; do
            [ -z "$RAW" ] && continue
            echo "═══ Rendu: $CID (fichier: ${RAW}_finale.mp4) ═══"
            npx remotion render src/index.jsx "$CID" \
              "../OUT/${RAW}_finale.mp4" \
              --codec h264 \
              --image-format jpeg \
              --concurrency 1
          done
          # CUSTOS F04 check-out exige OUT/codex.json (avec le codex validé)
          cp public/codex.json ../OUT/codex.json
          ls -la ../OUT/

      - name: F04 - Gardien CUSTOS (check-out)
        if: github.event.inputs.fregate == 'F04'
        run: python3 LAC_CUSTOS.py --frigate F04 --mode check-out --drive-base .

      - name: F04 - Upload video finale
        if: github.event.inputs.fregate == 'F04'
        uses: actions/upload-artifact@v4
        with:
          name: lac-video-finale
          path: F04_RENDER/OUT/

      - name: F04 - Ledger
        if: github.event.inputs.fregate == 'F04'
        run: |
          python3 _tools/update_ledger.py F04
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: fregate F04 — render [skip ci]" || echo "No change"
          git push
          echo "Prochaine frégate: F05 (camouflage)"

      # ─────────────────────── F05 : CAMOUFLAGE ─────────────────────────────

      - name: F05 - Download video finale
        if: github.event.inputs.fregate == 'F05'
        run: |
          mkdir -p F05_CAMOUFLAGE/IN
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-video-finale F05_CAMOUFLAGE/IN/ "$BRANCH"

      - name: F05 - Camouflage
        if: github.event.inputs.fregate == 'F05'
        run: |
          cd F05_CAMOUFLAGE/CODEBASE
          python3 lac_f05_camouflage.py --input ../IN/ --output ../OUT/

      - name: F05 - Gardien CUSTOS
        if: github.event.inputs.fregate == 'F05'
        run: python3 LAC_CUSTOS.py --frigate F05 --mode check-out --drive-base .

      - name: F05 - Upload youtube_final
        if: github.event.inputs.fregate == 'F05'
        uses: actions/upload-artifact@v4
        with:
          name: lac-youtube
          path: F05_CAMOUFLAGE/OUT/

      - name: F05 - Ledger
        if: github.event.inputs.fregate == 'F05'
        run: |
          python3 _tools/update_ledger.py F05
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: fregate F05 — camouflage [skip ci]" || echo "No change"
          git push
          echo "PORTE IV: télécharge l'artifact lac-youtube, vérifie, puis frégate F06"

      # ─────────────────────────── F06 : LUTHER ─────────────────────────────

      - name: F06 - Download youtube_final
        if: github.event.inputs.fregate == 'F06'
        run: |
          mkdir -p F06_LUTHER/IN
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-youtube F06_LUTHER/IN/ "$BRANCH"

      - name: F06 - Luther
        if: github.event.inputs.fregate == 'F06'
        run: |
          cd F06_LUTHER/CODEBASE
          python3 lac_f06_luther.py --input ../IN/ --output ../OUT/

      - name: F06 - Gardien CUSTOS
        if: github.event.inputs.fregate == 'F06'
        run: python3 LAC_CUSTOS.py --frigate F06 --mode check-out --drive-base .

      - name: F06 - Upload clean_final
        if: github.event.inputs.fregate == 'F06'
        uses: actions/upload-artifact@v4
        with:
          name: lac-clean
          path: F06_LUTHER/OUT/

      - name: F06 - Ledger
        if: github.event.inputs.fregate == 'F06'
        run: |
          python3 _tools/update_ledger.py F06
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: fregate F06 — production complète [skip ci]" || echo "No change"
          git push
          echo "ARTEFACT FINAL: télécharge lac-clean (clip_00X_clean.mp4)"

      # ──────────────────────────── CLOSE ───────────────────────────────────

      - name: CLOSE - Fermeture
        if: github.event.inputs.fregate == 'CLOSE'
        run: |
          python3 _tools/update_ledger.py CLOSE
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: fregate CLOSE [skip ci]" || echo "No change"
          git push
          echo "Production fermée."
