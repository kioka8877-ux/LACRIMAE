# LACRIMAE Orchestrator — Rubicon sur GitHub Actions
# Pattern OMNIS_WATCH delta : un run par gate, le Champion déclenche depuis l'UI
# Actions (workflow_dispatch), l'opérateur n'intervient qu'aux portes.
#
# Portes (inputs gate) :
#   G1  BRIEF + INGEST     — le Champion fournit url/titre/sujet/vibe/params
#   G2  ORACLE             — F01 sélectionne les séquences (vision OpenRouter)
#                            → cutlist.json commitée (éditable via l'UI GitHub)
#   G3  FORMAT             — F02 blur-pad/reframe → codex.json commité
#                            (Porte III : éditer codex.json dans F03_PREVIEW/IN)
#   G4  RENDER             — F04 Remotion (lit le codex validé du repo)
#   G5  CAMOUFLAGE + LUTHER — F05 puis F06 → clean_final.mp4
#   CLOSE                  — ferme la production (ledger)
#
# Secrets requis : ORACLE_API_KEY (secret), ORACLE_MODEL/ORACLE_BASE_URL (vars)

name: LACRIMAE Orchestrator

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Porte (G1|G2|G3|G4|G5|CLOSE)'
        required: true
        default: 'G1'
      url:
        description: 'URL YouTube (G1 only)'
        required: false
      title:
        description: 'Titre de la production (G1 only)'
        required: false
      sujet:
        description: 'Sujet / brief oracle (G1 only)'
        required: false
      vibe:
        description: 'Vibe / tonalité (G1 only)'
        required: false
      sequences:
        description: 'Nombre de séquences 1-10 (G1 only)'
        required: false
        default: '2'
      min_dur:
        description: 'Durée min par séquence en secondes (G1 only)'
        required: false
        default: '3'
      max_dur:
        description: 'Durée max par séquence en secondes (G1 only)'
        required: false
        default: '10'
      profile:
        description: 'Profil F02 (blur-pad|reframe|background) (G1 only)'
        required: false
        default: 'blur-pad'
      pack_path:
        description: 'Pack local optionnel (forge only) — SI ABSENT, l''Oracle va chercher le pack SEUL dans PERTURABO/EXPORT'
        required: false
      pack_filter:
        description: 'Filtre du pack auto-récupéré (forge only, substring du nom, ex: SANDOVAL)'
        required: false
      preset:
        description: 'Preset couleurs codex (G1 only)'
        required: false
        default: 'punchy'
      model:
        description: 'Modèle vision OpenRouter (override)'
        required: false
      mode:
        description: 'Mode pipeline (libre|forge)'
        required: false
        default: 'libre'

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WORKFLOW_FILE: lacrimae_orchestrator.yml
  BRANCH: dev

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests yt-dlp -q

      # ───────────────────────── G1 : BRIEF + INGEST ─────────────────────────

      - name: G1 - Ecrire le brief
        if: github.event.inputs.gate == 'G1'
        env:
          URL: ${{ github.event.inputs.url }}
          TITLE: ${{ github.event.inputs.title }}
          SUJET: ${{ github.event.inputs.sujet }}
          VIBE: ${{ github.event.inputs.vibe }}
          SEQUENCES: ${{ github.event.inputs.sequences }}
          MIN_DUR: ${{ github.event.inputs.min_dur }}
          MAX_DUR: ${{ github.event.inputs.max_dur }}
          PROFILE: ${{ github.event.inputs.profile }}
          PRESET: ${{ github.event.inputs.preset }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          mkdir -p TRACKING
          jq -n \
            --arg url "$URL" \
            --arg title "$TITLE" \
            --arg sujet "$SUJET" \
            --arg vibe "$VIBE" \
            --arg seq "$SEQUENCES" \
            --arg min "$MIN_DUR" \
            --arg max "$MAX_DUR" \
            --arg profile "$PROFILE" \
            --arg preset "$PRESET" \
            --arg model "$MODEL" \
            '{source: $url, title: $title, sujet: $sujet, vibe: $vibe,
              sequences: ($seq|tonumber), min_dur: ($min|tonumber),
              max_dur: ($max|tonumber), profile: $profile, preset: $preset,
              model: $model}' > TRACKING/LACRIMAE_BRIEF.json
          cat TRACKING/LACRIMAE_BRIEF.json

      - name: G1 - Ingest
        if: github.event.inputs.gate == 'G1'
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          cd F00_INGEST/CODEBASE
          if [ -n "$URL" ]; then
            python3 lac_f00_ingest.py --url "$URL" --output ../OUT/
          elif [ -f "../../SHARED/IN/video_source.mp4" ]; then
            python3 lac_f00_ingest.py --file "../../SHARED/IN/video_source.mp4" --output ../OUT/
          elif [ -f "../IN/video_source.mp4" ]; then
            python3 lac_f00_ingest.py --file "../IN/video_source.mp4" --output ../OUT/
          else
            echo "ERREUR: ni URL ni SHARED/IN/video_source.mp4 ni F00_INGEST/IN/video_source.mp4"
            exit 1
          fi

      - name: G1 - Gardien F00
        if: github.event.inputs.gate == 'G1'
        run: python3 LAC_CUSTOS.py --frigate F00 --mode check-out --drive-base .

      - name: G1 - Upload video
        if: github.event.inputs.gate == 'G1'
        uses: actions/upload-artifact@v4
        with:
          name: lac-video
          path: F00_INGEST/OUT/

      - name: G1 - Ledger + commit
        if: github.event.inputs.gate == 'G1'
        run: |
          python3 _tools/update_ledger.py G1
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_BRIEF.json TRACKING/LACRIMAE_LEDGER.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "ledger: gate G1 [skip ci]"
            git push
          fi
          echo "PORTE II: vérifie/édite F02_FORMAT/IN/cutlist.json (après G2), puis relance avec gate G2"

      # ──────────────────────────── G2 : ORACLE ou FORGE ──────────────────────

      - name: G2 - Download video
        if: github.event.inputs.gate == 'G2'
        run: |
          mkdir -p F01_SELECT/IN F02_FORMAT/IN
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-video F02_FORMAT/IN/ "$BRANCH"
          if [ "${{ github.event.inputs.mode }}" == "libre" ]; then
            cp F02_FORMAT/IN/video_source.mp4 F01_SELECT/IN/video_source.mp4
          fi

      # Mode FORGE : l'ORACLE va chercher le pack SEUL dans PERTURABO/EXPORT
      # (production_pack_*.json). Le bridge ne prend RIEN d'autre : la vidéo
      # vient de l'artifact G1, les fonds de SHARED/IN/backgrounds/ (faits une
      # fois pour toutes) et le logo de SHARED/IN/logos/logo.png.
      # F01 (vision) est SAUTÉE — les cuts viennent du pack Perturabo.
      - name: G2 - Forge bridge (Gate 1)
        if: github.event.inputs.gate == 'G2' && github.event.inputs.mode == 'forge'
        env:
          PACK: ${{ github.event.inputs.pack_path }}
          PACK_FILTER: ${{ github.event.inputs.pack_filter }}
        run: |
          PACK_ARG=""
          if [ -n "$PACK" ]; then PACK_ARG="--pack $PACK"; fi
          PACK_FILTER_ARG=""
          if [ -n "$PACK_FILTER" ]; then PACK_FILTER_ARG="--pack-filter $PACK_FILTER"; fi
          python3 BRIDGE_PERTURABO/CODEBASE/lac_bridge_forge.py \
            $PACK_ARG $PACK_FILTER_ARG \
            --video F02_FORMAT/IN/video_source.mp4
          mkdir -p F02_FORMAT/IN
          cp BRIDGE_PERTURABO/OUT/cutlist.json F02_FORMAT/IN/cutlist.json

      - name: G2 - Oracle (vision) — mode libre
        if: github.event.inputs.gate == 'G2' && github.event.inputs.mode != 'forge'
        env:
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          ORACLE_MODEL: ${{ vars.ORACLE_MODEL }}
          ORACLE_BASE_URL: ${{ vars.ORACLE_BASE_URL }}
          SEQUENCES: ${{ github.event.inputs.sequences }}
          MIN_DUR: ${{ github.event.inputs.min_dur }}
          MAX_DUR: ${{ github.event.inputs.max_dur }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          cd F01_SELECT/CODEBASE
          BRIEF_TXT=$(python3 - <<'PYEOF'
          import json
          b = json.load(open('../../TRACKING/LACRIMAE_BRIEF.json'))
          print(' | '.join([v for v in (b.get('sujet',''), b.get('vibe',''), b.get('title','')) if v]))
          PYEOF
          )
          MODEL_ARG=""
          if [ -n "$MODEL" ]; then MODEL_ARG="--model $MODEL"; fi
          python3 lac_f01_select.py --oracle \
            --input ../IN/ --output ../OUT/ \
            --sequences "$SEQUENCES" --min-dur "$MIN_DUR" --max-dur "$MAX_DUR" \
            --brief "$BRIEF_TXT" $MODEL_ARG
          cp ../OUT/cutlist.json ../../F02_FORMAT/IN/cutlist.json

      - name: G2 - Gardien F01/BRIDGE
        if: github.event.inputs.gate == 'G2'
        run: |
          if [ "${{ github.event.inputs.mode }}" == "forge" ]; then
            python3 LAC_CUSTOS.py --frigate BRIDGE --mode check-out --drive-base .
          else
            python3 LAC_CUSTOS.py --frigate F01 --mode check-out --drive-base .
          fi

      - name: G2 - Commit cutlist (éditable par le Champion)
        if: github.event.inputs.gate == 'G2'
        run: |
          python3 _tools/update_ledger.py G2
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          # En mode forge : le codex bridge (session + textes du pack) + le pack
          # auto-récupéré sont commités pour survivre jusqu'à G3 (run séparé —
          # le workspace ne persiste pas)
          if [ "${{ github.event.inputs.mode }}" == "forge" ]; then
            git add F02_FORMAT/IN/cutlist.json BRIDGE_PERTURABO/OUT/ BRIDGE_PERTURABO/IN/production_pack.json TRACKING/LACRIMAE_LEDGER.json
          else
            git add F02_FORMAT/IN/cutlist.json TRACKING/LACRIMAE_LEDGER.json
          fi
          git commit -m "ledger: gate G2 — cutlist [skip ci]" || echo "No change"
          git push
          echo "PORTE II FRANCHIE. Si besoin: édite F02_FORMAT/IN/cutlist.json dans l'UI GitHub"

      - name: G2 - Upload cutlist
        if: github.event.inputs.gate == 'G2'
        uses: actions/upload-artifact@v4
        with:
          name: lac-cutlist
          path: F02_FORMAT/IN/cutlist.json

      # ──────────────────────────── G3 : FORMAT ──────────────────────────────

      - name: G3 - Download video
        if: github.event.inputs.gate == 'G3'
        run: |
          mkdir -p F02_FORMAT/IN
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-video F02_FORMAT/IN/ "$BRANCH"

      - name: G3 - Format (blur-pad/reframe/background)
        if: github.event.inputs.gate == 'G3'
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          cd F02_FORMAT/CODEBASE
          PROFILE=$(python3 -c "import json; print(json.load(open('../../TRACKING/LACRIMAE_BRIEF.json')).get('profile','blur-pad'))")
          PRESET=$(python3 -c "import json; print(json.load(open('../../TRACKING/LACRIMAE_BRIEF.json')).get('preset','punchy'))")
          TITLE=$(python3 -c "import json; print(json.load(open('../../TRACKING/LACRIMAE_BRIEF.json')).get('title',''))")
          MODE_ARG=""
          FORGE_CODEX_ARG=""
          if [ "$MODE" == "forge" ] && [ -f "../../BRIDGE_PERTURABO/OUT/codex.json" ]; then
            MODE_ARG="--mode forge"
            # F02 lit le codex bridge : préserve la session (fond PNG/logo) et
            # reprend les textes par clip du pack — pas de quoting JSON en shell
            FORGE_CODEX_ARG="--forge-codex ../../BRIDGE_PERTURABO/OUT/codex.json"
          fi
          python3 lac_f02_format.py --input ../IN/ --output ../OUT/ \
            --profile "$PROFILE" --preset "$PRESET" --title "$TITLE" $MODE_ARG $FORGE_CODEX_ARG

      - name: G3 - Gardien F02
        if: github.event.inputs.gate == 'G3'
        run: python3 LAC_CUSTOS.py --frigate F02 --mode check-out --drive-base .

      - name: G3 - Commit codex + manifest (éditable par le Champion)
        if: github.event.inputs.gate == 'G3'
        run: |
          mkdir -p F03_PREVIEW/IN F04_RENDER/IN
          cp F02_FORMAT/OUT/codex.json F03_PREVIEW/IN/codex.json
          cp F02_FORMAT/OUT/f02_manifest.json F03_PREVIEW/IN/f02_manifest.json
          cp F02_FORMAT/OUT/codex.json F04_RENDER/IN/codex.json
          cp F02_FORMAT/OUT/f02_manifest.json F04_RENDER/IN/f02_manifest.json
          python3 _tools/update_ledger.py G3
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add F03_PREVIEW/IN/ F04_RENDER/IN/ TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: gate G3 — codex [skip ci]" || echo "No change"
          git push
          echo "PORTE III: édite F03_PREVIEW/IN/codex.json (titre, volume, validated_by_magos: true)"

      - name: G3 - Upload clips
        if: github.event.inputs.gate == 'G3'
        uses: actions/upload-artifact@v4
        with:
          name: lac-clips
          path: F02_FORMAT/OUT/clips/

      # ──────────────────────────── G4 : RENDER ──────────────────────────────

      - name: G4 - Download clips
        if: github.event.inputs.gate == 'G4'
        run: |
          mkdir -p F04_RENDER/CODEBASE/public F04_RENDER/IN/clips
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-clips F04_RENDER/CODEBASE/public/ "$BRANCH"
          cp F04_RENDER/CODEBASE/public/*.mp4 F04_RENDER/IN/clips/

      - name: G4 - Copy codex validé + logo + fond PNG
        if: github.event.inputs.gate == 'G4'
        run: |
          cp F03_PREVIEW/IN/codex.json F04_RENDER/IN/codex.json
          cp F03_PREVIEW/IN/codex.json F04_RENDER/CODEBASE/public/codex.json
          if [ -f SHARED/IN/logos/logo.png ]; then
            cp SHARED/IN/logos/logo.png F04_RENDER/CODEBASE/public/logo.png
          fi
          # Mode forge : les PNG partagés (SHARED/IN/backgrounds/ + logos/, faits
          # une fois pour toutes par l'opérateur) sont re-transités vers public/
          # des F03+F04 (public/ est gitignoré) + manifest.json (menu déroulant)
          if [ "${{ github.event.inputs.mode }}" == "forge" ]; then
            mkdir -p F04_RENDER/CODEBASE/public/backgrounds F03_PREVIEW/CODEBASE/public/backgrounds
            if compgen -G "SHARED/IN/backgrounds/*.png" > /dev/null; then
              cp SHARED/IN/backgrounds/*.png F04_RENDER/CODEBASE/public/backgrounds/
              cp SHARED/IN/backgrounds/*.png F03_PREVIEW/CODEBASE/public/backgrounds/
              python3 -c "import json,pathlib; files=sorted(p.name for p in pathlib.Path('SHARED/IN/backgrounds').glob('*.png')); [ (pathlib.Path(d)/'manifest.json').write_text(json.dumps({'files':files}), encoding='utf-8') for d in ('F04_RENDER/CODEBASE/public/backgrounds','F03_PREVIEW/CODEBASE/public/backgrounds') ]"
            fi
            if [ -f SHARED/IN/logos/logo.png ]; then
              cp SHARED/IN/logos/logo.png F04_RENDER/CODEBASE/public/logo.png
              cp SHARED/IN/logos/logo.png F03_PREVIEW/CODEBASE/public/logo.png
            fi
          fi

      - name: G4 - Gardien F04 (check-in)
        if: github.event.inputs.gate == 'G4'
        run: python3 LAC_CUSTOS.py --frigate F04 --mode check-in --drive-base .

      - name: G4 - Setup Node
        if: github.event.inputs.gate == 'G4'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: G4 - Install dependencies
        if: github.event.inputs.gate == 'G4'
        run: |
          cd F04_RENDER/CODEBASE
          npm install

      - name: G4 - Sync codexData.js depuis le codex validé
        if: github.event.inputs.gate == 'G4'
        run: |
          cd F04_RENDER/CODEBASE
          python3 - <<'PYEOF'
          import json
          codex = json.load(open('public/codex.json', encoding='utf-8'))
          with open('src/codexData.js', 'w', encoding='utf-8') as f:
              f.write('export const codex = ' + json.dumps(codex, ensure_ascii=False, indent=2) + ';\n')
          print('codexData.js synchronisé depuis public/codex.json')
          PYEOF

      - name: G4 - Render Remotion (un rendu par clip)
        if: github.event.inputs.gate == 'G4'
        run: |
          cd F04_RENDER/CODEBASE
          CLIP_IDS=$(python3 - <<'PYEOF'
          import json
          c = json.load(open('public/codex.json', encoding='utf-8'))
          clips = c.get('clips') or [c]
          for clip in clips:
              print(clip.get('id') or clip['video']['source'].replace('.mp4',''))
          PYEOF
          )
          mkdir -p ../OUT
          for CID in $CLIP_IDS; do
            echo "═══ Rendu: $CID ═══"
            npx remotion render src/index.jsx "$CID" \
              "../OUT/${CID}_finale.mp4" \
              --codec h264 \
              --image-format jpeg \
              --concurrency 1
          done
          # CUSTOS F04 check-out exige OUT/codex.json (avec le codex validé)
          cp public/codex.json ../OUT/codex.json
          ls -la ../OUT/

      - name: G4 - Gardien F04 (check-out)
        if: github.event.inputs.gate == 'G4'
        run: python3 LAC_CUSTOS.py --frigate F04 --mode check-out --drive-base .

      - name: G4 - Upload video finale
        if: github.event.inputs.gate == 'G4'
        uses: actions/upload-artifact@v4
        with:
          name: lac-video-finale
          path: F04_RENDER/OUT/

      - name: G4 - Ledger
        if: github.event.inputs.gate == 'G4'
        run: |
          python3 _tools/update_ledger.py G4
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: gate G4 — render [skip ci]" || echo "No change"
          git push
          echo "PORTE IV: télécharge l'artifact lac-video-finale, vérifie, puis gate G5"

      # ───────────────────── G5 : CAMOUFLAGE + LUTHER ────────────────────────

      - name: G5 - Download video finale
        if: github.event.inputs.gate == 'G5'
        run: |
          mkdir -p F05_CAMOUFLAGE/IN
          python3 _tools/download_artifact.py "$GH_TOKEN" "$WORKFLOW_FILE" lac-video-finale F05_CAMOUFLAGE/IN/ "$BRANCH"

      - name: G5 - Camouflage
        if: github.event.inputs.gate == 'G5'
        run: |
          cd F05_CAMOUFLAGE/CODEBASE
          python3 lac_f05_camouflage.py --input ../IN/ --output ../OUT/

      - name: G5 - Gardien F05
        if: github.event.inputs.gate == 'G5'
        run: python3 LAC_CUSTOS.py --frigate F05 --mode check-out --drive-base .

      - name: G5 - Upload youtube_final
        if: github.event.inputs.gate == 'G5'
        uses: actions/upload-artifact@v4
        with:
          name: lac-youtube
          path: F05_CAMOUFLAGE/OUT/

      - name: G5 - Luther
        if: github.event.inputs.gate == 'G5'
        run: |
          mkdir -p F06_LUTHER/IN
          cp F05_CAMOUFLAGE/OUT/*.mp4 F06_LUTHER/IN/
          cd F06_LUTHER/CODEBASE
          python3 lac_f06_luther.py --input ../IN/ --output ../OUT/

      - name: G5 - Gardien F06
        if: github.event.inputs.gate == 'G5'
        run: python3 LAC_CUSTOS.py --frigate F06 --mode check-out --drive-base .

      - name: G5 - Upload clean_final
        if: github.event.inputs.gate == 'G5'
        uses: actions/upload-artifact@v4
        with:
          name: lac-clean
          path: F06_LUTHER/OUT/

      - name: G5 - Ledger
        if: github.event.inputs.gate == 'G5'
        run: |
          python3 _tools/update_ledger.py G5
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: gate G5 — production complète [skip ci]" || echo "No change"
          git push
          echo "ARTEFACT FINAL: télécharge lac-clean (clean_final.mp4)"

      # ──────────────────────────── CLOSE ────────────────────────────────────

      - name: CLOSE - Fermeture
        if: github.event.inputs.gate == 'CLOSE'
        run: |
          python3 _tools/update_ledger.py CLOSE
          git config user.name "lacrimae-orchestrator"
          git config user.email "orchestrator@lacrimae"
          git add TRACKING/LACRIMAE_LEDGER.json
          git commit -m "ledger: gate CLOSE [skip ci]" || echo "No change"
          git push
          echo "Production fermée."
