name: F03 RENDER

on:
  workflow_dispatch:
    inputs:
      f00d_run_id:
        description: 'Run F00-D validé contenant Intro Hybrid et séquences Match Cut'
        required: true
        type: string
      codex_source:
        description: 'Codex fourni dans dev4/public/codex.json'
        required: false
        default: 'repo'
        type: string
  push:
    branches: [main]
    paths:
      - 'F03_PREVIEW/CODEBASE/**'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: F03_PREVIEW/CODEBASE/package-lock.json

      - name: Install
        working-directory: F03_PREVIEW/CODEBASE
        run: npm ci

      - name: Download validated F00-D artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          F00D_RUN_ID: ${{ inputs.f00d_run_id }}
        run: |
          test -n "$F00D_RUN_ID"
          gh run download "$F00D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "lacrimae-dev4-f00d-$F00D_RUN_ID" \
            --dir /tmp/f00d-artifact
          test -f /tmp/f00d-artifact/hybrid_manifest.json
          test -f /tmp/f00d-artifact/intro/intro.mp4
          test -f /tmp/f00d-artifact/match_cut/sequences.json
          mkdir -p F03_PREVIEW/CODEBASE/public/sequences F03_PREVIEW/CODEBASE/public/intro
          cp /tmp/f00d-artifact/hybrid_manifest.json F03_PREVIEW/CODEBASE/public/hybrid_manifest.json
          cp /tmp/f00d-artifact/intro/intro.mp4 F03_PREVIEW/CODEBASE/public/intro/intro.mp4
          cp /tmp/f00d-artifact/match_cut/sequences.json F03_PREVIEW/CODEBASE/public/sequences.json
          cp /tmp/f00d-artifact/match_cut/sequences.json F03_PREVIEW/CODEBASE/public/match_cut_sequences.json
          cp /tmp/f00d-artifact/match_cut/sequences/*.mp4 F03_PREVIEW/CODEBASE/public/sequences/
          test "$(find F03_PREVIEW/CODEBASE/public/sequences -name '*.mp4' | wc -l)" -eq 129

      - name: Render (LacrimaeShort)
        working-directory: F03_PREVIEW/CODEBASE
        run: npm run render

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: short_final
          path: F03_PREVIEW/CODEBASE/out/short_final.mp4
          retention-days: 14
