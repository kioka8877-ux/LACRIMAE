name: F04 RENDER (dev)

on:
  workflow_dispatch:
    inputs:
      clip:
        description: 'Clip à rendre (clip-001..clip-005) ou "all"'
        required: false
        default: 'all'
  push:
    branches: [dev, dev2, dev3]
    paths:
      - 'F04_RENDER/**'

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      clips: ${{ steps.choose.outputs.clips }}
    steps:
      - id: choose
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.clip }}" != "all" ]; then
            echo "clips=[\"${{ inputs.clip }}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Clips du codex (mode stars = N clips découpés, mode MEME = N memes
          # stagés par F02) — on rend exactement les compositions du codex.
          # Repli clip-001..clip-005 si le codex est absent ou illisible.
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          try:
              c = json.load(open('F04_RENDER/IN/codex.json', encoding='utf-8'))
              clips = c.get('clips') or [c]
              ids = [((x.get('id') or x['video']['source'].replace('.mp4', '')).replace('_', '-')) for x in clips if x.get('video')]
              print('clips=' + json.dumps(ids))
          except Exception:
              print('clips=["clip-001","clip-002","clip-003","clip-004","clip-005"]')
          PYEOF

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: select
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJSON(needs.select.outputs.clips) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: F04_RENDER/CODEBASE/package-lock.json

      - name: Install
        working-directory: F04_RENDER/CODEBASE
        run: npm ci

      - name: Stage assets (fonds + logos + clip du job)
        working-directory: F04_RENDER/CODEBASE
        run: |
          mkdir -p public/backgrounds
          cp ../../SHARED/IN/backgrounds/*.png public/backgrounds/
          mkdir -p public/logos
          cp ../../SHARED/IN/logos/*.png public/logos/
          cp ../../SHARED/IN/*.png public/logos/
          ls public/logos/*.png | xargs -n1 basename | sort > public/logos/manifest.list
          python3 - <<'EOF'
          import json
          files = [l.strip() for l in open('public/logos/manifest.list') if l.strip()]
          json.dump({"files": files}, open('public/logos/manifest.json', 'w'))
          EOF
          rm -f public/logos/manifest.list
          cp public/logos/logo.png public/logo.png
          src=$(echo "${{ matrix.clip }}" | tr '-' '_')
          cp "../../F02_FORMAT/OUT/clips/${src}.mp4" public/
          # Mode MEME : la méméthèque → public/memes/ + manifest.json (parcours
          # preview + rendu). Garde : rien à faire si pas de memes (mode stars).
          if compgen -G "../../SHARED/memes/*.mp4" > /dev/null; then
            mkdir -p public/memes
            cp ../../SHARED/memes/*.mp4 public/memes/
            python3 -c "import json,pathlib; files=sorted(p.name for p in pathlib.Path('../../SHARED/memes').glob('*.mp4')); json.dump({'files':files}, open('public/memes/manifest.json','w'))"
          fi

      - name: F04b SIGNE — signatures anti-doublon + codex final
        working-directory: F04_RENDER/CODEBASE
        run: python3 lac_signe.py --codex ../IN/codex.json --js src/codexData.js --signatures ../IN/signatures.json

      - name: Render ${{ matrix.clip }}
        working-directory: F04_RENDER/CODEBASE
        run: |
          mkdir -p OUT
          npx remotion render src/index.jsx "${{ matrix.clip }}" "OUT/${{ matrix.clip }}.mp4"

      - name: Upload artifact ${{ matrix.clip }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.clip }}
          path: F04_RENDER/CODEBASE/OUT/${{ matrix.clip }}.mp4
          retention-days: 14
