name: DEV8 — Spider-Man Music Analysis

on:
  workflow_dispatch:

jobs:
  f00-music:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download music from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="music-spiderman"
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[0].id')
          ASSET_NAME=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[0].name')
          gh api "repos/${{ github.repository }}/releases/assets/$ASSET_ID" -H "Accept: application/octet-stream" > "/tmp/music.mp3"
          echo "Downloaded: $ASSET_NAME ($(stat -c%s /tmp/music.mp3) bytes)"

      - name: Run F00-MUSIC
        run: |
          python3 F00_INGEST/CODEBASE/f00_music.py \
            --audio /tmp/music.mp3 \
            --output "$RUNNER_TEMP/music_timeline.json" \
            --fps 30

      - name: Bundle output
        run: |
          mkdir -p "$RUNNER_TEMP/dev8-music"
          cp /tmp/music.mp3 "$RUNNER_TEMP/dev8-music/music.mp3"
          cp "$RUNNER_TEMP/music_timeline.json" "$RUNNER_TEMP/dev8-music/music_timeline.json"
          cat "$RUNNER_TEMP/music_timeline.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dev8-spiderman-music-${{ github.run_id }}
          path: ${{ runner.temp }}/dev8-music/
          retention-days: 14
